<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>RATTIB Challenge — Arrange to Understand</title><meta name="description" content="Practise all 56 RATTIB cards with Arrange, Guess the Card and Connect activities.">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: a tabletop of flat geometric cards. Home is the route A to H with one pip per card;
   every game screen is a single card plus its answers, so attention stays on the concept. */
:root{
  --bg:#f6f4ec; --surface:#FFFFFF; --surface-2:#eeece3; --ink:#151515; --muted:#555555; --line:#ccc9be;
  --accent:#075ccc; --on-accent:#FFFFFF;
  --good:#17794D; --good-bg:#DCF3E7; --bad:#B3302A; --bad-bg:#FBE0DD; --part:#8F5309; --part-bg:#FCEBD3;
  --sA:#FFFFFF; --sB:#ef2429; --sC:#123578; --sD:#ffd629; --sE:#222222; --sF:#94d8f5; --sG:#ff8817; --sH:#08613f;
  --f-display:Arial,Helvetica,sans-serif;
  --f-body:Arial,Helvetica,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto}
h1,h2,h3,p,ul,ol,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shape{flex:none;display:block}
.fc>.shape,.tile-top>.shape,.bin-top>.shape,.code>.shape{stroke:#777;stroke-width:.8;filter:drop-shadow(0 0 1px #888)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{font:800 1.25rem var(--f-display);letter-spacing:.14em}
.brand-sub{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ext{font-size:.9rem;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.ext:hover{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:18px 0 28px}
.eyebrow{font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1{font:800 clamp(2rem,6.2vw,3.5rem)/1.03 var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:10px 0 14px}
.lede{max-width:56ch;color:var(--muted);font-size:1.05rem}
.fan{position:relative;width:230px;height:190px;flex:none}
.fc{position:absolute;width:106px;height:142px;background:var(--surface);border:1px solid var(--line);
  border-top:6px solid var(--s);border-radius:8px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:var(--s)}
.fc span{font-family:var(--f-mono);font-weight:600;font-size:.85rem;color:var(--ink)}
.fc.c1{left:0;top:22px;transform:rotate(-8deg)}
.fc.c2{left:58px;top:2px;transform:rotate(3deg)}
.fc.c3{left:118px;top:26px;transform:rotate(11deg)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.fan{display:none}}

/* buttons */
.btn{font-weight:700;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:11px 20px;cursor:pointer;min-height:44px}
.btn:hover:not([disabled]){filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px var(--ink);filter:none}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:8px 0;color:var(--muted);cursor:pointer;font-weight:600}
.link:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* home: modes */
.sec-title{font:800 1.2rem var(--f-display);letter-spacing:-.01em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:12px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mode-ico{color:var(--accent)}
.mode h3{font:800 1.5rem var(--f-display);letter-spacing:-.01em}
.mode .best{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mode p{color:var(--muted)}
.mode .meta{font-size:.85rem}
.mode .btn{margin-top:auto;align-self:flex-start}

/* home: route */
.route{margin-top:36px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.route-head p{color:var(--muted);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--s);
  border-radius:8px;padding:12px 14px;text-decoration:none;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile-top{display:flex;align-items:center;gap:8px;color:var(--s)}
.tile-top b{font:800 1.15rem var(--f-display);color:var(--ink)}
.tile-name{font-weight:600;line-height:1.25;min-height:2.5em}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:8px;border-radius:2px;border:1.5px solid var(--line)}
.pips i.on{background:var(--s);border-color:#777}
.tile-count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.foot .link{font-size:.85rem;padding:6px 0}

/* game frame */
.gbar{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:8px}
.gmeta{display:flex;gap:10px;align-items:baseline;justify-content:center}
.gmeta b{font:800 1rem var(--f-display)}
.gmeta span,.gstats span{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.gstats{display:flex;gap:14px}
.gstats b{color:var(--ink)}
@media (max-width:520px){.gbar{grid-template-columns:auto 1fr}.gstats{grid-column:1/-1;justify-content:space-between}.gmeta{justify-content:flex-end}}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.seg i.cur{background:var(--accent)}
.seg i.ok{background:var(--good)}
.seg i.no{background:var(--bad)}
.seg i.part{background:var(--part)}
.stage{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.prompt{font:700 1.15rem/1.3 var(--f-display)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--s,var(--line));border-radius:8px;
  padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.card-title{font:800 clamp(1.5rem,5vw,2.1rem)/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.card-title.q{color:var(--muted)}
.kws{display:flex;flex-wrap:wrap;gap:8px}
.kws li{border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.95rem}
.kws li.off{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:500}
.desc.off{color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;padding:8px 12px;font-size:.92rem}
.worth{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.code{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:.8rem;padding:3px 8px;
  border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink);flex:none}
.code .shape{color:var(--s)}
.code.ghost{color:var(--muted);font-weight:500}

/* answers */
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-left:6px solid var(--s);border-radius:8px;padding:10px 12px;min-height:72px;cursor:pointer}
.bin-top{display:flex;align-items:center;gap:8px;color:var(--s)}
.bin-top b{font:800 1.1rem var(--f-display);color:var(--ink)}
.bin-name{font-size:.88rem;line-height:1.25;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);
  border-radius:8px;padding:12px 14px;cursor:pointer;min-height:52px;width:100%}
.opt .k{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted);flex:none}
.opt-t{flex:1;min-width:0}
.bin:hover:not([disabled]),.opt:hover:not([disabled]){border-color:var(--ink)}
.bin[disabled],.opt[disabled]{cursor:default}
.bin[disabled]:not(.correct):not(.wrong),.opt[disabled]:not(.correct):not(.wrong){opacity:.55}
.bin.correct,.opt.correct{background:var(--good-bg);border-color:var(--good)}
.bin.wrong,.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.btn,.opt,.bin,.tile,.slot{transition:border-color .12s,background-color .12s,filter .12s}}

/* feedback */
.fb{border:1.5px solid var(--line);border-left-width:6px;border-radius:8px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.fb.good{border-color:var(--good);background:var(--good-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.part{border-color:var(--part);background:var(--part-bg)}
.fb-head{display:flex;justify-content:space-between;gap:10px;font:800 1.1rem var(--f-display)}
.fb.good .fb-head{color:var(--good)}
.fb.bad .fb-head{color:var(--bad)}
.fb.part .fb-head{color:var(--part)}
.pts{font-family:var(--f-mono);font-size:.95rem}
.pts small{font-size:.75rem;opacity:.85}
.fb-sec{font-size:.92rem;color:var(--muted)}
.fb-sub{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--line)}
.note > div{min-width:0}
.note p{font-size:.95rem}
.fb .btn{align-self:flex-start}

/* connect */
.scenario{padding:14px 16px;border-left:6px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;font-size:1.1rem}
.pair{display:flex;flex-wrap:wrap;gap:12px}
.pair-card{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--s);border-radius:8px;
  padding:10px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.pair-card b{font:800 1.15rem var(--f-display)}

/* sequence */
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;border:1.5px dashed var(--line);border-radius:8px;padding:6px 12px;background:var(--surface);text-align:left;width:100%}
.slot .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:1.6em;flex:none}
.slot .st{font-weight:700}
.slot .sk{color:var(--muted);font-size:.8rem;margin-left:auto;text-align:right}
button.slot{cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--ink)}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:44px}
.chip:hover{background:var(--surface-2)}
.chip small{color:var(--muted);font-size:.78rem}

/* results */
.res{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.res-score{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end}
.big{font:800 clamp(3.2rem,12vw,5rem)/1 var(--f-display);letter-spacing:-.03em}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat b{font:800 1.5rem var(--f-display)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
  background:var(--accent);color:var(--on-accent);padding:3px 10px;border-radius:4px;align-self:flex-start}
.review{display:grid;gap:10px;margin-top:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--s);border-radius:8px;padding:12px 14px}
.rv .note{border-top:0;padding-top:0}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.92rem}
.links a{color:var(--accent)}
.practice-note{margin-top:14px;color:var(--muted);font-size:.92rem;max-width:76ch}
.reflection{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.reflection label{font-weight:700}
.reflection textarea{width:100%;min-height:100px;resize:vertical;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
.reflection small{color:var(--muted)}
/* Shared visual language with the RATTIB companion. */
.brand-mark{text-decoration:none;letter-spacing:-1px;font-size:26px;font-weight:950}.brand-mark span:nth-child(3n+1){color:#075ccc}.brand-mark span:nth-child(3n+2){color:#ef2429}.brand-mark span:nth-child(3n){color:#078554}.top{border-bottom:2px solid var(--ink);margin-bottom:22px}.btn{background:var(--ink);border:2px solid var(--ink);border-radius:0}.btn:hover:not([disabled]){background:var(--accent);filter:none}.btn.ghost{border:1px solid var(--line)}.btn.ghost:hover:not([disabled]){background:var(--surface-2)}.mode,.tile,.card,.pair-card{border-left-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink);border-radius:0}.mode{border-top:6px solid #ffd629}.mode:nth-child(2){border-top-color:#075ccc}.mode:nth-child(3){border-top-color:#ff8817}@media(max-width:420px){.top{flex-wrap:wrap}.brand{gap:8px}}
</style>

function rx(s){return s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function mask(card){
  var t=card.e;
  var re=new RegExp(rx(card.t).replace(/\s+/g,'\\s+')+'(?:e?s)?','ig');
  var out=t.replace(re,'_____');
  if(out===t){
    card.t.split(/[\s\/+\-]+/).filter(function(w){return w.length>=4;}).forEach(function(w){
      out=out.replace(new RegExp('\\b'+rx(w)+'\\w*','ig'),'_____');
    });
  }
  return out;
}

/* ---------- Storage ---------- */
var KEY='rattib-challenge-v2';
function emptyStore(){return {best:{},progress:{},notes:{},schema:3};}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var r=JSON.parse(raw);if(r&&(r.schema===2||r.schema===3)&&r.progress&&typeof r.progress==='object'&&!Array.isArray(r.progress)){
      r.best=r.best||{};r.notes=r.notes||{};
      if(r.schema===2){
        var p2=r.progress.F2,p7=r.progress.F7;
        delete r.progress.F2;delete r.progress.F7;
        if(p2){r.progress.F7=p2;}if(p7){r.progress.F2=p7;}
        var notes={};Object.keys(r.notes).forEach(function(k){
          notes[k.replace(/F[27]\b/g,function(code){return code==='F2'?'F7':'F2';})]=r.notes[k];
        });r.notes=notes;r.schema=3;
      }
      return r;
    }}
    var legacy=JSON.parse(localStorage.getItem('rattib-challenge-v1'));
    var migrated=emptyStore();
    if(legacy&&legacy.best){migrated.best=legacy.best;}
    if(legacy&&legacy.mastered){CARDS.forEach(function(c){
      if(legacy.mastered[c.c==='F2'?'F7':c.c==='F7'?'F2':c.c]){migrated.progress[c.c]={attempts:0,everCorrect:true,legacy:true,evidence:[]};}
    });}
    // Preserve historical high scores; scores are practice records, not mastery evidence.
    return migrated;
  }catch(e){return emptyStore();}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var store=load();
function progressFor(code){
  var p=store.progress[code];

}
function correctCount(){return CARDS.filter(function(c){return progressFor(c.c).everCorrect;}).length;}
function attemptedCount(){return CARDS.filter(function(c){var p=progressFor(c.c);return p.attempts>0||p.legacy;}).length;}
function consistent(code){
  var p=progressFor(code),rounds={},modes={},applied=false;
  (p.evidence||[]).forEach(function(e){rounds[e.round]=true;modes[e.mode]=true;if(e.mode==='connect'){applied=true;}});
  return Object.keys(rounds).length>=3&&Object.keys(modes).length>=2&&applied;
}
function consistentCount(){return CARDS.filter(function(c){return consistent(c.c);}).length;}
function record(code,ok){
  var p=progressFor(code);
  p.attempts=(p.attempts||0)+1;
  p.everCorrect=!!p.everCorrect||ok;
  if(ok){
    p.evidence=(p.evidence||[]).filter(function(e){return e.round!==G.roundId||e.mode!==G.mode;});
    p.evidence.push({round:G.roundId,mode:G.mode});
    p.evidence=p.evidence.slice(-12);
  }else{p.evidence=[];}
  store.progress[code]=p;
}

/* ---------- Round builders ---------- */
function rankMap(){var m={};CARDS.forEach(function(c){m[c.c]=(progressFor(c.c).everCorrect?1:0)+Math.random()*1.3;});return m;}

function buildArrange(){
  var r=rankMap();
  function byRank(a,b){return r[a.c]-r[b.c];}
  var picked=[];
  SECTIONS.forEach(function(s){picked.push(CARDS.filter(function(c){return c.c[0]===s.id;}).sort(byRank)[0]);});
  picked.push(CARDS.filter(function(c){return picked.indexOf(c)<0;}).sort(byRank)[0]);
  var qs=shuffle(picked).map(function(card){return {type:'sort',card:card};});
  var hc=CARDS.filter(function(c){return c.c[0]==='H';});
  var codes=hc.map(function(c){return c.c;});
  var order=shuffle(codes);
  while(order.join()===codes.join()){order=shuffle(codes);}
  qs.push({type:'seq',cards:hc,order:order,placed:[]});
  return qs;
}

function titleOptions(card){
  var same=shuffle(CARDS.filter(function(x){return x.c!==card.c&&x.c[0]===card.c[0]&&x.t!==card.t;}));
  var other=shuffle(CARDS.filter(function(x){return x.c[0]!==card.c[0]&&x.t!==card.t;}));
  var seen={};seen[card.t]=1;var picks=[];
  same.slice(0,2).concat(other).forEach(function(x){if(picks.length<3&&!seen[x.t]){seen[x.t]=1;picks.push(x);}});
  return shuffle([card].concat(picks));
}
function buildGuess(){
  var r=rankMap();
  var top=CARDS.slice().sort(function(a,b){return r[a.c]-r[b.c];}).slice(0,10);
  return shuffle(top).map(function(card){return {type:'guess',card:card,options:titleOptions(card),clue:1};});
}
function buildConnect(){
  function rk(cs){return -cs.filter(function(c){return !progressFor(c).everCorrect;}).length*0.6+Math.random()*1.5;}
  var links=LINKS.map(function(l){return {l:l,r:rk(l.cards)};}).sort(function(a,b){return a.r-b.r;}).slice(0,4).map(function(x){return x.l;});
  var cases=CASES.map(function(c){return {c:c,r:rk([c.a])};}).sort(function(a,b){return a.r-b.r;}).slice(0,4).map(function(x){return x.c;});
  var qs=links.map(function(l){
    return {type:'link',cards:l.cards,why:l.why,noteKey:'link-'+l.cards.join('-'),options:shuffle([{t:l.ok,ok:true}].concat(l.bad.map(function(t,i){return {t:t,ok:false,why:l.whyBad[i]};})))};
  }).concat(cases.map(function(c){
    return {type:'case',s:c.s,a:c.a,why:c.why,whyWrong:c.whyWrong,originalDistractors:c.d,noteKey:'case-'+c.a,options:shuffle([c.a].concat(c.d))};
  }));
  return shuffle(qs);
}

/* ---------- State ---------- */
var G=null;
var resetArmed=false,resetTimer=null;

function start(mode){
  var qs=mode==='arrange'?buildArrange():(mode==='guess'?buildGuess():buildConnect());
  G={roundId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),mode:mode,qs:qs,i:0,score:0,streak:0,bestStreak:0,log:[],misses:{},correct:0,done:false,answered:null,newBest:false};
  render();window.scrollTo(0,0);
}

function settle(o){
  var bonus=0,pts=o.base||0;
  if(o.ok){G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);G.correct++;if(!o.noBonus){bonus=G.streak>=3?Math.min(10,(G.streak-2)*2):0;}}
  else{G.streak=0;if(!o.partial){pts=0;}}
  G.score+=pts+bonus;
  G.log[G.i]=o.ok?'ok':(o.partial?'part':'no');
  (o.right||[]).forEach(function(c){record(c,true);});
  (o.wrong||[]).forEach(function(c){record(c,false);G.misses[c]=true;});
  save();
  G.answered={ok:o.ok,partial:!!o.partial,pts:pts,bonus:bonus,picked:o.picked,detail:o.detail};
}

function onPick(v){
  if(!G||G.answered||G.done){return;}
  var q=G.qs[G.i],ok;
  if(q.type==='sort'){
    ok=v===q.card.c[0];
    settle({ok:ok,base:10,picked:v,right:ok?[q.card.c]:[],wrong:ok?[]:[q.card.c]});
  }else if(q.type==='guess'){
    ok=v===q.card.c;
    settle({ok:ok,base:GUESS_PTS[q.clue],picked:v,right:ok?[q.card.c]:[],wrong:ok?[]:[q.card.c]});
  }else if(q.type==='link'){
    ok=!!q.options[+v].ok;
    settle({ok:ok,base:12,picked:+v,right:ok?q.cards:[],wrong:ok?[]:q.cards});
  }else if(q.type==='case'){
    ok=v===q.a;
    settle({ok:ok,base:12,picked:v,right:ok?[q.a]:[],wrong:ok?[]:[q.a]});
  }
  render();focusNext();
}

function seqCheck(){
  var q=G.qs[G.i];
  if(G.answered||q.placed.length<q.cards.length){return;}
  var right=[],wrong=[];
  q.cards.forEach(function(c,i){(q.placed[i]===c.c?right:wrong).push(c.c);});
  var perfect=wrong.length===0;
  settle({ok:perfect,partial:right.length>0,base:right.length*4+(perfect?10:0),noBonus:true,right:right,wrong:wrong});
  render();focusNext();
}

function next(){
  if(!G||!G.answered){return;}
  G.answered=null;
  if(G.i>=G.qs.length-1){
    G.done=true;
    G.newBest=G.score>(store.best[G.mode]||0);
    if(G.newBest){store.best[G.mode]=G.score;}
    save();
  }else{G.i++;}
  render();window.scrollTo(0,0);
}

     '<div class="fc c3" style="--s:var(--sH)">'+shape('H',34)+'<span>H4</span></div></div></section>'+
   '<section><h2 class="sec-title">Choose a challenge</h2><div class="modes">'+modes+'</div></section>'+
   '<section class="route"><div class="route-head"><h2 class="sec-title">Your route, A to H</h2><p>'+hint+'</p></div><div class="tiles">'+tiles+'</div><p class="practice-note">Filled pips mean answered correctly at least once. Consistent practice means correct in 3 different rounds across at least 2 modes, including Connect, since the most recent error. These are practice records; mastery needs your own explanation, application to a new example, and discussion with a facilitator. Scores and streaks describe the round only. Progress and reflections are saved in this browser.</p></section>'+
   '<div class="foot"><span>Each section tile opens its page on the companion site.</span>'+
   '<button class="link" data-action="reset">'+(resetArmed?'Tap again to clear all progress':'Reset progress')+'</button></div>';
}

function gameFrame(inner){
  var N=G.qs.length;
  var segs=G.qs.map(function(_,i){return '<i class="'+(G.log[i]||(i===G.i?'cur':''))+'"></i>';}).join('');
  return topbar()+
   '<div class="gbar"><button class="link" data-action="home">← Exit</button>'+
   '<div class="gmeta"><b>'+MODES[G.mode].name+'</b><span>'+(G.i+1)+' / '+N+'</span></div>'+
   '<div class="gstats"><span>Score <b>'+G.score+'</b></span><span>Streak <b>'+G.streak+'</b></span></div></div>'+
   '<div class="seg" role="progressbar" aria-label="Round progress" aria-valuemin="1" aria-valuemax="'+N+'" aria-valuenow="'+(G.i+1)+'">'+segs+'</div>'+
   '<div class="stage">'+inner+'</div>';
}

function fbBlock(head,body){
  var a=G.answered,last=G.i===G.qs.length-1;
  var cls=a.ok?'good':(a.partial?'part':'bad');
  var total=a.pts+a.bonus;
  return '<div class="fb '+cls+'" role="status" aria-live="polite"><p class="fb-head"><span>'+head+'</span>'+
    '<span class="pts">+'+total+(a.bonus?' <small>('+a.bonus+' streak)</small>':'')+'</span></p>'+body+
    reflectionBlock()+ '<button class="btn" data-action="next">'+(last?'See results':'Next')+'</button></div>';
}

function reflectionBlock(){
  if(G.mode!=='connect'){return '';}
  var q=G.qs[G.i];
  return '<div class="reflection"><label for="reasoning">Explain it in your own words</label><p>Give a different example. Why does the selected concept fit, and how would a nearby concept change your explanation?</p><textarea id="reasoning" data-note="'+esc(q.noteKey)+'" placeholder="Optional: write your reasoning, or discuss it with a partner.">'+esc(store.notes[q.noteKey]||'')+'</textarea><small>Optional reflection · saved in this browser · not automatically graded or used as evidence of mastery.</small></div>';
}

function viewSort(q){
  var a=G.answered,c=q.card,sid=c.c[0];
  var bins=SECTIONS.map(function(s){
    var cls='bin';
    if(a){if(s.id===sid){cls+=' correct';}else if(s.id===a.picked){cls+=' wrong';}}
    return '<button class="'+cls+'" style="--s:'+sv(s.id)+'" data-action="pick" data-v="'+s.id+'"'+(a?' disabled':'')+'>'+
      '<span class="bin-top">'+shape(s.id,16)+'<b>'+s.id+'</b></span><span class="bin-name">'+esc(s.name)+'</span></button>';
  }).join('');
  var kws=c.k.map(function(k){return '<li>'+esc(k)+'</li>';}).join('');
  var card='<article class="card"'+(a?' style="--s:'+sv(sid)+'"':'')+'><div class="card-top">'+
    (a?codeChip(c.c):'<span class="code ghost">Card ?</span>')+'</div>'+
    '<h2 class="card-title">'+esc(c.t)+'</h2><ul class="kws">'+kws+'</ul></article>';
  var fb='';
  if(a){
    fb=fbBlock(a.ok?'Correct.':'Not quite.',
      '<p>This is <b>'+c.c+' '+esc(c.t)+'</b>, in section '+sid+': '+esc(sec(sid).name)+'.</p>'+
      '<p>'+esc(c.e)+'</p>'+(a.ok?'':'<p class="fb-sec">'+esc(sec(sid).connect)+'</p>'));
  }
  return gameFrame('<p class="prompt">Which section does this card belong to?</p>'+card+'<div class="bins">'+bins+'</div>'+fb);
}

function viewSeq(q){
  var a=G.answered;
  var slots=q.cards.map(function(c,i){
    var code=q.placed[i],n='<span class="n">'+(i+1)+'</span>';
    if(a){
      var ok=code===c.c,cc=byCode[code];
      return '<div class="slot '+(ok?'ok':'no')+'">'+n+'<span class="st">'+esc(cc.t)+'</span><span class="sk">'+(ok?'Correct':'Belongs at '+(q.cards.map(function(x){return x.c;}).indexOf(code)+1))+'</span></div>';
    }
    if(code){var cd=byCode[code];return '<button class="slot filled" data-action="seq-remove" data-v="'+i+'" aria-label="Remove '+esc(cd.t)+'">'+n+'<span class="st">'+esc(cd.t)+'</span><span class="sk">Tap to remove</span></button>';}
    return '<div class="slot">'+n+'<span class="sk" style="margin-left:0">Empty</span></div>';
  }).join('');
  var pool=q.order.filter(function(c){return q.placed.indexOf(c)<0;}).map(function(code){
    var c=byCode[code];return '<button class="chip" data-action="seq-add" data-v="'+code+'"><b>'+esc(c.t)+'</b><small>'+c.k.map(esc).join(', ')+'</small></button>';
  }).join('');
  var ready=q.placed.length===q.cards.length;
  var controls=a?'':'<div class="row"><button class="btn" data-action="seq-check"'+(ready?'':' disabled')+'>Check order</button>'+
    '<button class="btn ghost" data-action="seq-clear"'+(q.placed.length?'':' disabled')+'>Clear</button></div>';
  var fb='';
  if(a){
    var right=q.cards.filter(function(c,i){return q.placed[i]===c.c;}).length;
    fb=fbBlock(a.ok?'Perfect order.':right+' of '+q.cards.length+' in place.',
      '<p>This learning route runs from idea to evidence-led revision. Development is iterative: testing and feedback can lead a team back to earlier activities.</p>'+q.cards.map(cardNote).join(''));
  }
  return gameFrame('<p class="prompt">Put the development stages in order, from first to last.</p>'+
    '<ol class="slots">'+slots+'</ol>'+(a?'':'<div class="pool">'+pool+'</div>')+controls+fb);
}

function viewGuess(q){
  var a=G.answered,c=q.card;
  var kw=c.k.map(function(k,i){return (i<q.clue||a)?'<li>'+esc(k)+'</li>':'<li class="off">Clue '+(i+1)+'</li>';}).join('');
  var desc=a?'<p>'+esc(c.e)+'</p>':(q.clue>=4?'<p>'+esc(mask(c))+'</p>':'<p class="desc off">Description (last clue)</p>');
  var worth=a?'':'<span class="worth">Worth '+GUESS_PTS[q.clue]+'</span>';
  var title=a?'<h2 class="card-title">'+esc(c.t)+'</h2>':'<h2 class="card-title q">? ? ?</h2>';
  var card='<article class="card"'+(a?' style="--s:'+sv(c.c[0])+'"':'')+'><div class="card-top">'+
    (a?codeChip(c.c):'<span class="code ghost">Card ?</span>')+worth+'</div>'+title+'<ul class="kws">'+kw+'</ul>'+desc+'</article>';
  var opts=q.options.map(function(o,i){
    var cls='opt';
    if(a){if(o.c===c.c){cls+=' correct';}else if(o.c===a.picked){cls+=' wrong';}}
    return '<button class="'+cls+'" data-action="pick" data-v="'+o.c+'"'+(a?' disabled':'')+'><span class="k">'+(i+1)+'</span><span class="opt-t">'+esc(o.t)+'</span></button>';
  }).join('');
  var clueBtn=a?'':'<div class="row"><button class="btn ghost" data-action="clue"'+(q.clue>=4?' disabled':'')+'>'+
    (q.clue>=4?'All clues shown':'Next clue (worth '+GUESS_PTS[q.clue+1]+')')+'</button></div>';
  var fb='';
  if(a){fb=fbBlock(a.ok?'Correct.':'Not quite.','<p>The card is <b>'+c.c+' '+esc(c.t)+'</b>, in section '+c.c[0]+': '+esc(sec(c.c[0]).name)+'.</p>');}
  return gameFrame('<p class="prompt">Name the card. Fewer clues earn more points.</p>'+card+clueBtn+'<div class="opts">'+opts+'</div>'+fb);
}

function viewLink(q){
  var a=G.answered;
  var pair=q.cards.map(function(code){
    return '<div class="pair-card" style="--s:'+sv(code[0])+'">'+codeChip(code)+'<b>'+esc(byCode[code].t)+'</b></div>';
  }).join('');
  var opts=q.options.map(function(o,i){
    var cls='opt';
    if(a){if(o.ok){cls+=' correct';}else if(i===a.picked){cls+=' wrong';}}
    return '<button class="'+cls+'" data-action="pick" data-v="'+i+'"'+(a?' disabled':'')+'><span class="k">'+(i+1)+'</span><span class="opt-t">'+esc(o.t)+'</span></button>';
  }).join('');
  var fb='';
  if(a){
    var chosen=q.options[a.picked];
    var correct=q.options.filter(function(o){return o.ok;})[0];
    var explanation='<p><b>Best explanation:</b> '+esc(correct.t)+'</p><p>'+esc(q.why)+'</p>';
    if(!a.ok){explanation+='<p><b>Why your option is less suitable:</b> '+esc(chosen.why)+'</p>';}
    fb=fbBlock(a.ok?'Correct.':'Not quite.',explanation+q.cards.map(function(c){return cardNote(byCode[c]);}).join(''));
  }
  return gameFrame('<p class="prompt">Which statement best explains how these cards connect?</p><div class="pair">'+pair+'</div><div class="opts">'+opts+'</div>'+fb);
}

function viewCase(q){
  var a=G.answered;
  var opts=q.options.map(function(code,i){
    var c=byCode[code],cls='opt';
    if(a){if(code===q.a){cls+=' correct';}else if(code===a.picked){cls+=' wrong';}}
    return '<button class="'+cls+'" data-action="pick" data-v="'+code+'"'+(a?' disabled':'')+'><span class="k">'+(i+1)+'</span><span class="opt-t">'+esc(c.t)+'</span>'+codeChip(code)+'</button>';
  }).join('');
  var fb='';
  if(a){
    var body='<p>Best fit: <b>'+q.a+' '+esc(byCode[q.a].t)+'</b>.</p>'+cardNote(byCode[q.a]);
    body+='<p>'+esc(q.why)+'</p>';
    if(!a.ok){body+='<p><b>Why the other concept is less direct here:</b> '+esc(q.whyWrong[q.originalDistractors.indexOf(a.picked)])+'</p><p class="fb-sub">You chose</p>'+cardNote(byCode[a.picked]);}
    fb=fbBlock(a.ok?'Correct.':'Not quite.',body);
  }
  return gameFrame('<p class="prompt">Which card would you turn to first?</p><blockquote class="scenario">'+esc(q.s)+'</blockquote><div class="opts">'+opts+'</div>'+fb);
}

function viewResults(){
  var N=G.qs.length;
  var segs=G.qs.map(function(_,i){return '<i class="'+(G.log[i]||'')+'"></i>';}).join('');
  var misses=Object.keys(G.misses).sort().map(function(c){return byCode[c];});
  var secs={};misses.forEach(function(c){secs[c.c[0]]=1;});
  var review=misses.length?
    '<section><h2 class="sec-title">Worth another look</h2><div class="review">'+
      misses.map(function(c){return '<div class="rv" style="--s:'+sv(c.c[0])+'">'+cardNote(c)+'</div>';}).join('')+'</div>'+
      '<p class="links">'+Object.keys(secs).sort().map(function(id){
        return '<a href="'+WEB+'/section-'+id.toLowerCase()+'.html" target="_blank" rel="noopener">Revisit section '+id+' on the companion site ↗</a>';}).join('')+'</p></section>':
    '<section><h2 class="sec-title">No misses</h2><p class="lede">Every card in this round was answered correctly.</p></section>';
  return topbar()+
   '<div class="res"><div><p class="eyebrow">'+MODES[G.mode].name+' · round complete</p></div>'+
   '<div class="res-score"><div class="big">'+G.score+'</div>'+
     '<div class="stat"><span>Correct</span><b>'+G.correct+' of '+N+'</b></div>'+
     '<div class="stat"><span>Best streak</span><b>'+G.bestStreak+'</b></div>'+
     '<div class="stat"><span>Mode best</span><b>'+(store.best[G.mode]||0)+'</b></div></div>'+
   (G.newBest?'<span class="tag">New best</span>':'')+
   '<div class="seg" aria-hidden="true">'+segs+'</div>'+
   '<div class="row"><button class="btn" data-action="again" data-mode="'+G.mode+'">Play again</button>'+
   '<button class="btn ghost" data-action="home">Back to challenges</button></div>'+
   review+'<p class="practice-note">This round contributes to your practice history. A correct selection is one piece of evidence. Explain and apply the concept to a new situation before making a judgment about mastery.</p></div>';
}

function render(){
  var html;
  if(!G){html=viewHome();}
  else if(G.done){html=viewResults();}
  else{
    var q=G.qs[G.i];
    html=q.type==='sort'?viewSort(q):q.type==='seq'?viewSeq(q):q.type==='guess'?viewGuess(q):q.type==='link'?viewLink(q):viewCase(q);
  }
  app.innerHTML=html;
}

/* ---------- Events ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el||el.disabled){return;}
  var act=el.getAttribute('data-action'),v=el.getAttribute('data-v');
  var q=G&&!G.done?G.qs[G.i]:null;
  if(act==='start'||act==='again'){start(el.getAttribute('data-mode'));}
  else if(act==='home'){G=null;render();window.scrollTo(0,0);}
  else if(act==='pick'){onPick(v);}
  else if(act==='next'){next();}
  else if(act==='clue'){if(q&&q.type==='guess'&&!G.answered&&q.clue<4){q.clue++;render();}}
  else if(act==='seq-add'){if(q&&q.type==='seq'&&!G.answered){q.placed.push(v);render();}}
  else if(act==='seq-remove'){if(q&&q.type==='seq'&&!G.answered){q.placed.splice(+v,1);render();}}
  else if(act==='seq-clear'){if(q&&q.type==='seq'&&!G.answered){q.placed=[];render();}}
  else if(act==='seq-check'){seqCheck();}
  else if(act==='reset'){
    if(resetArmed){store=emptyStore();save();try{localStorage.removeItem('rattib-challenge-v1');}catch(e){}resetArmed=false;clearTimeout(resetTimer);render();}
    else{resetArmed=true;render();clearTimeout(resetTimer);resetTimer=setTimeout(function(){resetArmed=false;if(!G){render();}},4000);}
  }
});

app.addEventListener('input',function(e){
  var key=e.target.getAttribute('data-note');
  if(key){store.notes[key]=e.target.value.slice(0,10000);save();}
});

document.addEventListener('keydown',function(e){
  if(e.target&&/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)){return;}
  if(!G||G.done||G.answered||e.ctrlKey||e.metaKey||e.altKey){return;}
  var q=G.qs[G.i],k=e.key.toLowerCase();
  if(q.type==='sort'&&/^[a-h]$/.test(k)){onPick(k.toUpperCase());}
  else if(q.type==='guess'&&/^[1-4]$/.test(k)){onPick(q.options[+k-1].c);}
  else if(q.type==='link'&&/^[1-3]$/.test(k)){onPick(String(+k-1));}
  else if(q.type==='case'&&/^[1-4]$/.test(k)){onPick(q.options[+k-1]);}
});

render();
})();
</script>

</body></html>
